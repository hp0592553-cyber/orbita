name: Orbita - build BETA=0 (unico workflow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbita-full-elf.yml'
      - 'deps/webrtc-xenon/build.sh'
      - 'app/h264play/Makefile'
      - 'app/h264play/source/wifi/xw_xenon.c'
      - 'app/h264play/source/dec/xc_decdiag.c'
      - 'app/h264play/source/dec/xc_prof_compat.h'
      - 'app/h264play/source/**'
      - 'app/h264play/hosttest/**'
      - 'deps/webrtc-xenon/mbedtls/**'

permissions:
  contents: read

jobs:
  orbita-beta0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar codigo do Orbita
        uses: actions/checkout@v4

      - name: Gerar interface e baixar dependencias oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .orbita-ci reports
          python3 -m venv .orbita-ci/python
          .orbita-ci/python/bin/python -m pip -q install pillow==11.3.0
          .orbita-ci/python/bin/python app/h264play/tools/gen_xui_assets.py app/h264play/source/ui/xui_assets.h
          git clone --quiet --depth 1 --branch n0.10.2 https://github.com/FFmpeg/FFmpeg.git .orbita-ci/ffmpeg
          git clone --quiet --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git .orbita-ci/opus-src
          # Fonte libpeer fixada, sem credenciais; patch portado do green-nx.
          git init -q .orbita-ci/libpeer
          git -C .orbita-ci/libpeer remote add origin https://github.com/sepfy/libpeer.git
          git -C .orbita-ci/libpeer fetch --quiet --depth 1 origin 9319aa434cb9e893faed0293ba9d2a21eca59c8b
          git -C .orbita-ci/libpeer checkout -q FETCH_HEAD
          git -C .orbita-ci/libpeer submodule update --init --recursive --depth 1
          curl -fsSL --retry 2 https://raw.githubusercontent.com/rmrf404/green-nx/main/deps/patches/libpeer-switch.patch -o .orbita-ci/libpeer-switch.patch
          git -C .orbita-ci/libpeer apply --check ../libpeer-switch.patch
          git -C .orbita-ci/libpeer apply ../libpeer-switch.patch
          test -s app/h264play/source/ui/xui_assets.h
          # The GOLDEN stream is gitignored. Generate a real original baseline
          # H.264 test pattern so embedded playback remains a valid diagnostic.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30" \
            -t 2 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p -profile:v baseline \
            -f h264 "$RUNNER_TEMP/orbita-test.h264"
          python3 - "$RUNNER_TEMP/orbita-test.h264" app/h264play/source/embedded_stream.c <<'PY'
          import pathlib
          import sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert data.startswith(b"\x00\x00\x00\x01") or data.startswith(b"\x00\x00\x01")
          output = pathlib.Path(sys.argv[2])
          with output.open("w", encoding="utf-8") as f:
              f.write("/* CI-generated original H.264 test pattern. */\n")
              f.write("#include <stddef.h>\n#include <stdint.h>\n")
              f.write("const uint8_t embedded_stream[] = {\n")
              for i in range(0, len(data), 16):
                  f.write("    " + ",".join(str(x) for x in data[i:i+16]) + ",\n")
              f.write("};\nconst size_t embedded_stream_len = sizeof(embedded_stream);\n")
          print(f"Embedded original stream: {len(data)} bytes")
          PY
          test -s app/h264play/source/embedded_stream.c

      - name: Testar HTTPS publico do servidor oficial (sem autenticar)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          status=$(curl -sS --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' https://x360.pistatrack.com/)
          echo "HTTPS publico x360.pistatrack.com: HTTP $status" | tee reports/servidor-oficial.txt
          test "$status" != '000'
          # Uma unica consulta sem credenciais: checa se a API beta responde, nao tenta ativar.
          api_status=$(curl -sS --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' https://x360.pistatrack.com/v1/beta/check || true)
          echo "API beta sem chave: HTTP $api_status" | tee -a reports/servidor-oficial.txt

      - name: Construir bibliotecas Xenon e Orbita BETA=0
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/app" -w /app -e DEVKITXENON=/usr/local/xenon \
            free60/libxenon:latest /bin/bash -eo pipefail -c '
              export PATH=/usr/local/xenon/bin:/usr/local/xenon/usr/bin:$PATH
              # Arquivos do checkout sao do runner; root no container precisa marcar como confiaveis.
              git config --global --add safe.directory /app/.orbita-ci/opus-src
              git config --global --add safe.directory /app/.orbita-ci/ffmpeg
              git config --global --add safe.directory /app/.orbita-ci/libpeer
              git config --global --add safe.directory /app/.orbita-ci/libpeer/third_party/usrsctp
              git config --global --add safe.directory /app/.orbita-ci/libpeer/third_party/libsrtp
              echo "=== Free60 compiler ==="
              xenon-gcc --version | head -n 1
              echo "=== FFmpeg 0.10.2 Xenon ==="
              cd /app/.orbita-ci/ffmpeg
              ./configure \
                --target-os=none --arch=powerpc --cpu=cell \
                --enable-cross-compile --cc=xenon-gcc --cross-prefix=xenon- \
                --disable-shared --enable-static --disable-everything \
                --disable-doc --disable-avdevice --disable-avfilter --disable-postproc \
                --disable-pthreads --disable-altivec --disable-yasm --disable-asm \
                --disable-network --enable-decoder=h264 --enable-parser=h264 \
                --enable-demuxer=h264 --enable-protocol=file \
                --extra-cflags="-O2 -m32 -mpowerpc64 -mhard-float -fno-pic -DXENON -D__XENON__ -D_GNU_SOURCE -D_DEFAULT_SOURCE -Wno-error=incompatible-pointer-types" \
                --extra-ldflags="-m32 -nostdlib -Wl,-e,main"
              # FFmpeg 0.10.2 nao reconhece as funcoes matematicas de newlib no cross-link.
              # Se HAVE_* ficar 0, o header legado redeclara essas funcoes e GCC 16 falha.
              for func in LRINT LRINTF ROUND ROUNDF TRUNC TRUNCF MKSTEMP; do
                sed -i "s/#define HAVE_$func 0/#define HAVE_$func 1/" config.h
              done
              # newlib: disponibilizar declaracao POSIX de mkstemp ao arquivo legado.
              sed -i "/#include <unistd.h>/a #include <stdlib.h>" libavutil/file.c
              make -j2 libavcodec/libavcodec.a libavutil/libavutil.a
              echo "=== Opus Xenon ==="
              cd /app
              OPUS_SRC=/app/.orbita-ci/opus-src OPUS_OUT=/app/.orbita-ci/opus-xenon J=2 \
                bash deps/build-opus-xenon.sh
              echo "=== WebRTC e TLS Xenon ==="
              if ! command -v python3 >/dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq python3
              fi
              LIBPEER_DIR=/app/.orbita-ci/libpeer OUTROOT=/app/.orbita-ci/webrtc-xenon \
                bash deps/webrtc-xenon/build.sh xenon
              echo "=== Orbita BETA=0 ==="
              rm -f app/h264play/h264play.elf app/h264play/h264play.elf32
              make -C app/h264play clean
              make -C app/h264play -j2 BETA=0 AUDIO=1 GPU=0 BOOT_UPDATE_FIRST=0 VARIANT=beta0-tls32-netpump \
                DECODE_THREADS=1 ALTIVEC=0 USB_INTERVAL_PIPE=0 FFMPEG_NO_PROF=1 \
                FFMPEG_DIR=/app/.orbita-ci/ffmpeg \
                OPUS_DIR=/app/.orbita-ci/opus-xenon \
                WEBRTC_DIR=/app/.orbita-ci/webrtc-xenon/xenon
              test -s app/h264play/h264play.elf32
              # Diagnostic only: translate the addresses from the Xbox
              # segmentation-fault photo with the matching unstripped ELF.
              # No change to Xbox execution or runtime behaviour.
              echo "=== Segfault address symbolication ==="
              {
                echo "Captured Xbox exception (verify same ELF version):"
                echo "SRR0=0x8050fdc0 DAR=0x00000004 LR=0x805129cc"
                echo "Stack: 0x8050fdc0 0x805129cc 0x804ce12c 0x804efb0c 0x80515970 0x80507a20 0x80504660 0x80431dcc 0x804329d8"
                echo
                if command -v xenon-addr2line >/dev/null 2>&1; then
                  for addr in 0x8050fdc0 0x805129cc 0x804ce12c 0x804efb0c 0x80515970 0x80507a20 0x80504660 0x80431dcc 0x804329d8; do
                    echo "ADDRESS $addr"
                    xenon-addr2line -f -C -i -e /app/app/h264play/h264play.elf "$addr" || true
                  done
                else
                  echo "xenon-addr2line unavailable"
                fi
                if command -v xenon-objdump >/dev/null 2>&1; then
                  echo
                  echo "DISASSEMBLY around SRR0 (0x8050fdc0):"
                  xenon-objdump -d -C -S --start-address=0x8050fd80 --stop-address=0x8050fe30 /app/app/h264play/h264play.elf || true
                  echo
                  echo "DISASSEMBLY around LR (0x805129cc):"
                  xenon-objdump -d -C -S --start-address=0x80512980 --stop-address=0x80512a20 /app/app/h264play/h264play.elf || true
                else
                  echo "xenon-objdump unavailable"
                fi
              } > /app/reports/crash-symbolication.txt 2>&1
            ' > reports/build.log 2>&1
          rc=$?
          cp .orbita-ci/ffmpeg/config.log reports/ffmpeg-config.log 2>/dev/null || true
          if [ "$rc" -ne 0 ] && [ -s reports/ffmpeg-config.log ]; then
            echo '=== FFmpeg configure diagnostics ==='
            tail -n 60 reports/ffmpeg-config.log
          fi
          echo "$rc" > reports/exitcode.txt
          tail -n 90 reports/build.log
          if [ -s reports/crash-symbolication.txt ]; then
            echo '=== Xbox crash source mapping (photo addresses) ==='
            cat reports/crash-symbolication.txt
          fi
          if [ "$rc" -eq 0 ] && [ -s app/h264play/h264play.elf32 ]; then
            cp app/h264play/h264play.elf32 reports/orbita-beta0.elf32
            # Keep a matching unstripped image and link map to resolve
            # console exception SRR0/LR addresses to exact functions.
            cp app/h264play/h264play.elf reports/orbita-beta0-debug.elf
            link_map="$(find app/h264play -type f -name 'h264play.elf.map' -print -quit)"
            if [ -n "$link_map" ] && [ -s "$link_map" ]; then
              cp "$link_map" reports/orbita-beta0-link.map
            else
              echo "WARNING: link map not found" > reports/map-warning.txt
            fi
            sha256sum reports/orbita-beta0.elf32 reports/orbita-beta0-debug.elf > reports/orbita-beta0.sha256
            echo "COMPILACAO_REAL_OK" > reports/status.txt
          else
            echo "COMPILACAO_INCOMPLETA (exit=$rc) - ver build.log" > reports/status.txt
          fi
          exit 0

      - name: Publicar arquivos ou relatorio da falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbita-beta0-resultado
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Confirmar resultado sem sucesso falso
        if: always()
        shell: bash
        run: |
          echo "## Orbita BETA=0" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/status.txt ]; then
            cat reports/status.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -s reports/orbita-beta0.elf32 ]; then
            echo "Novo ELF nao foi gerado; consultar build.log" >&2
            exit 1
          fi
          echo "ELF experimental gerado; nao autoriza acesso a servidores beta." >> "$GITHUB_STEP_SUMMARY"
