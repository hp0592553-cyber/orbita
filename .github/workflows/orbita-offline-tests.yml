name: Orbita - testes experimentais offline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/orbita-offline-tests.yml'
      - 'app/h264play/source/**'
      - 'app/h264play/hosttest/**'
      - 'deps/webrtc-xenon/mbedtls/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbita-offline-tests.yml'
      - 'app/h264play/source/**'
      - 'app/h264play/hosttest/**'
      - 'deps/webrtc-xenon/mbedtls/**'

permissions:
  contents: read

jobs:
  teste-offline:
    name: Testes de compatibilidade no Linux (sem servidor oficial)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Conferir configuracao do projeto
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BETA ?= 1' app/h264play/Makefile
          grep -Fq 'XCLOUD360_BETA=$(BETA)' app/h264play/Makefile
          test -f app/h264play/hosttest/beta/run_beta.sh
          test -f app/h264play/hosttest/beta/fake_server.py
          echo "Configuracoes e arquivos de teste encontrados."
          echo "Este job NAO compila um ELF para Xbox nem remove a ativacao oficial."

      - name: Baixar mbedTLS para compilar os testes no Linux
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v3.4.0 \
            https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/mbedtls"
          grep -q '3.4.0' "$RUNNER_TEMP/mbedtls/include/mbedtls/build_info.h"

      - name: Compilar e executar testes unitarios e servidor simulado
        shell: bash
        env:
          MBEDTLS_DIR: ${{ runner.temp }}/mbedtls
        run: |
          set -euo pipefail
          sh app/h264play/hosttest/beta/run_beta.sh
          echo '=== Login Microsoft: parsers HTTP/DNS e catalogo JSON (sem rede) ==='
          sh app/h264play/hosttest/login/run_login.sh unit
          echo '=== Catalogo: fixtures e parsing com ASan/UBSan (sem rede) ==='
          sh app/h264play/hosttest/catalog/run_catalog.sh unit
          echo '=== Sincronizacao offline do cache XC360 ==='
          python3 tools/orbita-sync/sync_cache.py --self-test
          echo '=== Orcamento do pump UDP (preserva Wi-Fi e controle) ==='
          cc -std=c11 -Wall -Wextra -Werror app/h264play/hosttest/webrtc/udp_tx_budget_test.c -o "$RUNNER_TEMP/udp_tx_budget_test"
          "$RUNNER_TEMP/udp_tx_budget_test"
          echo '=== Iniciar jogo, fila e sessao xCloud com servidor GSSV simulado ==='
          sh app/h264play/hosttest/session/run_session.sh unit
          echo '=== Interface grafica e renderizacao de capas (simulada) ==='
          python3 -m venv "$RUNNER_TEMP/orbita-ui-venv"
          "$RUNNER_TEMP/orbita-ui-venv/bin/pip" -q install pillow==11.3.0
          PATH="$RUNNER_TEMP/orbita-ui-venv/bin:$PATH" sh app/h264play/hosttest/ui/run.sh
          echo '=== TLS do Xbox: verificar configuracao de inteiros ==='
          grep -Fq '#define MBEDTLS_HAVE_INT32' deps/webrtc-xenon/mbedtls/xc360_mbedtls_webrtc_config.h
          grep -Fq 'xenon_mpi_limb_is_32_bit' deps/webrtc-xenon/build.sh
          echo 'Testes locais finalizados; nenhum pedido foi enviado ao Orbita oficial.'

      - name: Resumo
        if: always()
        shell: bash
        run: |
          {
            echo '## Orbita - testes offline'
            echo
            echo 'Este workflow testa beta, login, catalogo, sessao de jogo e interface em Linux com simulacoes, sem autenticar no Xbox real.'
            echo
            echo '**Nao produz xenon.elf; nao gera chave beta oficial nem libera streaming.**'
            echo
            echo 'Para gerar um ELF real, e necessario um ambiente completo devkitxenon e dependencias da arquitetura Xenon.'
          } >> "$GITHUB_STEP_SUMMARY"
